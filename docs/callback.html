<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok OAuth Callback - AutoClip</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: #151824;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
            --pink: #fe2c55;
            --pink-glow: rgba(254, 44, 85, 0.4);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(254, 44, 85, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .icon-badge {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--pink), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px var(--pink-glow);
            font-size: 32px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .code-box {
            background: #08090d;
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .code-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: var(--accent);
            word-break: break-all;
            display: block;
            margin-bottom: 12px;
        }

        .btn-copy {
            background: linear-gradient(135deg, var(--pink), #e02447);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--pink-glow);
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--pink-glow);
        }

        .instructions {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 18px;
            text-align: left;
            margin-top: 20px;
            border-left: 3px solid var(--accent);
        }

        .instructions ol {
            padding-left: 20px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        .instructions li strong {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-badge">✨</div>
        <h1 id="title">Autorização Concluída!</h1>
        <p id="subtitle">Seu código de autorização do TikTok foi gerado com sucesso.</p>

        <div class="code-box" id="codeContainer">
            <span class="code-value" id="codeText">Aguardando código...</span>
            <button class="btn-copy" id="copyBtn" onclick="copyCode()">📋 Copiar Código</button>
        </div>

        <div class="instructions">
            <p style="margin-bottom: 8px; color: #fff; font-weight: 700;">Próximos passos:</p>
            <ol>
                <li>Clique em <strong>Copiar Código</strong> acima.</li>
                <li>Cole no terminal para salvar seu <strong>TIKTOK_ACCESS_TOKEN</strong>!</li>
            </ol>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const codeText = document.getElementById('codeText');
        const copyBtn = document.getElementById('copyBtn');

        if (code) {
            codeText.innerText = code;
        } else {
            document.getElementById('title').innerText = "Nenhum código detectado";
            codeText.innerText = "Parâmetro 'code' não encontrado na URL. Certifique-se de ser redirecionado pelo TikTok.";
            copyBtn.style.display = 'none';
        }

        function copyCode() {
            if (code) {
                navigator.clipboard.writeText(code).then(() => {
                    copyBtn.innerText = "✅ Copiado!";
                    copyBtn.style.background = "#10b981";
                    setTimeout(() => {
                        copyBtn.innerText = "📋 Copiar Código";
                        copyBtn.style.background = "linear-gradient(135deg, var(--pink), #e02447)";
                    }, 3000);
                });
            }
        }
    </script>
</body>
</html>
